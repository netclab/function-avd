[project]
name = "function-avd"
version = "0.2.0"
description = "A Crossplane composition function that renders a fabric with Arista AVD and pushes each device's config"
authors = [
    { name = "mbakalarski", email = "64490638+mbakalarski@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "crossplane-function-sdk-python>=0.15.1",
    "netadopt[avd]>=0.7.0",
    "pyavd==6.4.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
avd-function = "function.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.function-avd]
crossplane = "v2.4.2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["avd"]
