[project]
name = "netclab-avd"
version = "0.1.0"
description = "Living AVD model driven by Crossplane XRs (Fabric -> Device composite function)"
readme = "README.md"
authors = [
    { name = "mbakalarski", email = "64490638+mbakalarski@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crossplane-function-sdk-python>=0.14.0",
    "pyavd==6.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
avd-verify = "avd_live_model.verify_example:main"
avd-verify-xr = "avd_live_model.verify_xr:main"
avd-function = "avd_live_model.composite_fn:cli"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# e2e needs a live cluster, so it is opt-in: `uv run pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = ["e2e: requires a cluster from scripts/kind-up.sh with a fabric applied"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is named for the repo (netclab-avd); the import package kept
# its own name. Without this the backend would derive `netclab_avd` from the
# project name and fail to find the module.
module-name = "avd_live_model"
