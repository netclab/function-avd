  design:
    type: rr
  declares:
  - rr1
  - rr2
---
apiVersion: avd.netclab.dev/v1alpha1
kind: Fabric
metadata:
  name: isis-ldp-ipvpn
spec:
  fabricName: FABRIC
  requires:
  - kind: SettingSet
    name: fabric
  - kind: NetworkServiceSet
    name: network-services
  - kind: NodeSet
    name: wan1
  - kind: SettingSet
    name: wan1-settings
  - kind: NodeSet
    name: wan1-pe-routers
  - kind: NodeSet
    name: wan1-p-routers
  - kind: NodeSet
    name: wan1-rr-routers
