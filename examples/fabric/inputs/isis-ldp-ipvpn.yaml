    type: pe
  declares:
  - pe1
  - pe2
  - pe3
---
apiVersion: avd.netclab.dev/v1alpha1
kind: NodeSet
metadata:
  name: wan1-p-routers
spec:
  design:
    type: p
  declares:
  - p1
  - p2
  - p3
  - p4
---
apiVersion: avd.netclab.dev/v1alpha1
kind: NodeSet
metadata:
