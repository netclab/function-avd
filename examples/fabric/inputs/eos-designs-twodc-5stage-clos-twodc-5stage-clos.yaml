apiVersion: avd.netclab.dev/v1alpha1
kind: NetworkServiceSet
metadata:
  name: tenants-networks-services
spec:
  design:
    tenants:
    - enable_mlag_ibgp_peering_vrfs: false
      l2vlans:
      - id: 2500
        name: web-l2-vlan
        tags:
        - web
        vni_override: 2500
      - bgp:
          raw_eos_cli: 'comment

            comment created from raw_eos_cli under router bgp l2vlan 2600

            EOF

            '
          structured_config:
            redistribute_routes:
            - router-mac system
        id: 2600
        name: web-l2-vlan-2
        rt_override: 32600
        tags:
        - web
      - id: 2601
        name: l2vlan_with_no_vxlan
        tags:
        - web
        vxlan: false
      mac_vrf_id_base: 20000
      mac_vrf_vni_base: 10000
      name: Tenant_A
      vrfs:
      - bgp:
          raw_eos_cli: 'comment

            Comment created from raw_eos_cli under BGP for VRF Common_VRF

            EOF

            '
        name: Common_VRF
        raw_eos_cli: "interface Loopback1000\n  description Loopback created from\
          \ raw_eos_cli under VRF Common_VRF\n"
        structured_config:
          domain_list:
          - structured-config.set.under.vrf.common-vrf
        svis:
        - enabled: true
          id: 110
          ip_address_virtual: 10.1.10.1/24
          name: Tenant_A_OP_Zone_1
          nodes:
          - node: DC1.POD1.LEAF2A
            structured_config:
              description: set from structured_config on svi for DC1.POD1.LEAF2A (was
                Tenant_A_OP_Zone_1)
          profile: TEST_PROFILE_STRUCT_CFG
          rt_override: 99110
          structured_config:
            description: set from structured_config on svi (was Tenant_A_OP_Zone_1)
          tags:
          - opzone
        - bgp:
            raw_eos_cli: 'comment

              comment created from raw_eos_cli under router bgp svi 111

              EOF

              '
            structured_config:
              redistribute_routes:
              - router-mac system
          id: 111
          ip_address_virtual: 10.1.11.1/24
          name: Tenant_A_OP_Zone_2
          tags:
          - opzone
          vni_override: 50111
        - enabled: true
          id: 112
          ip_address_virtual: 10.1.12.1/24
          name: Tenant_A_OP_Zone_3
          nodes:
          - node: DC1-POD1-LEAF1A
            raw_eos_cli: 'comment

              Comment created from raw_eos_cli under SVI 112 in VRF Common_VRF overridden
              on DC1-POD1-LEAF1A

              EOF

              '
          profile: TEST_PARENT_PROFILE_STRUCT_CFG
          raw_eos_cli: 'comment

            Comment created from raw_eos_cli under SVI 112 in VRF Common_VRF

            EOF

            '
          tags:
          - opzone
        - enabled: true
          id: 113
          ip_address_virtual: 10.10.13.1/24
          name: SVI_with_no_vxlan
          tags:
          - opzone
          vxlan: false
        vrf_vni: 1025
      - name: vrf_with_loopbacks_from_overlapping_pool
        svis:
        - enabled: true
          id: 1100
          ip_address_virtual: 10.100.100.1/24
          name: test_svi
          tags:
          - opzone
          - web
          vxlan: false
        vrf_vni: 1100
        vtep_diagnostic:
          loopback: 100
          loopback_ip_range: 10.100.0.0/24
      - name: vrf_with_loopbacks_from_pod_pools
        svis:
        - enabled: true
          id: 1101
          ip_address_virtual: 10.101.100.1/24
          name: test_svi
          tags:
          - opzone
          - web
          vxlan: false
        vrf_vni: 1101
        vtep_diagnostic:
          loopback: 101
          loopback_ip_pools:
          - ipv4_pool: 10.101.101.0-10.101.101.15, 10.101.101.16/28, 10.101.101.32-10.101.101.255
            ipv6_pool: 2001:db8:1::-2001:db8:1:7fff::, 2001:db8:1:8000::/49
            pod: DC1_POD1
          - ipv4_pool: 10.101.102.0/24
            pod: DC1_POD2
          - ipv4_pool: 10.101.201.0/24
            pod: DC2_POD1
          - ipv6_pool: 2001:db8:2::/48
            pod: DC2_POD2
      - name: vrf_with_loopbacks_dc1_pod1_only
        svis:
        - enabled: true
          id: 1102
          ip_address_virtual: 10.102.100.1/24
          name: test_svi
          tags:
          - opzone
          - web
          vxlan: false
        vrf_vni: 1102
        vtep_diagnostic:
          loopback: 102
          loopback_ip_pools:
          - ipv4_pool: 10.102.101.0/24
            pod: DC1_POD1
  appliesTo:
    nodeSets:
    - dc1-pod1-l2leaf1a
    - dc1-pod1-l2leaf2a
    - dc1-pod1-l2leaf2b
    - dc1-pod1-leaf1a
    - dc1-pod1-leaf1b
    - dc1-pod1-leaf2a
    - dc1-pod1-leaf2b
    - dc1-pod2-leaf1a
    - dc2-pod1-l2leaf1a
    - dc2-pod1-l2leaf2a
    - dc2-pod1-leaf1a
    - dc2-pod1-leaf2a
