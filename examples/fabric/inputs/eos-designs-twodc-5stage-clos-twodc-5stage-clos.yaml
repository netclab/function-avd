apiVersion: avd.netclab.dev/v1alpha1
kind: NodeSet
metadata:
  name: twodc-5stage-clos
spec:
  design:
    node_type_keys:
    - default_evpn_role: server
      ip_addressing:
        python_module: function.avd_compat
        python_class_name: AvdIpAddressingV2Spine
      key: spine
      type: spine
    - connected_endpoints: true
      default_evpn_role: client
      key: l3leaf
      mlag_support: true
      network_services:
        l2: true
        l3: true
      type: l3leaf
      vtep: true
    - connected_endpoints: true
      key: l2leaf
      mlag_support: true
      network_services:
        l2: true
      type: l2leaf
      underlay_router: false
      uplink_type: port-channel
    - key: super_spine
      type: super-spine
    - key: overlay_controller
      type: overlay-controller
  appliesTo:
    all: true
---
