---
apiVersion: avd.netclab.dev/v1alpha1
kind: SettingSet
metadata:
  name: dc1
spec:
  design:
    management_eapi:
      enabled: true
    mgmt_gateway: 172.16.1.1
  appliesTo:
    all: true
---
apiVersion: avd.netclab.dev/v1alpha1
kind: NodeSet
metadata:
  name: dc1-l2-leaves
spec:
  design:
    l2leaf:
      defaults:
        platform: cEOSLab
        spanning_tree_mode: mstp
      node_groups:
      - group: DC1_L2_LEAF1
        nodes:
        - id: 1
          mgmt_ip: 172.16.1.151/24
          name: dc1-leaf1c
        uplink_switches:
        - dc1-leaf1a
        - dc1-leaf1b
      - group: DC1_L2_LEAF2
        nodes:
        - id: 1
          mgmt_ip: 172.16.1.152/24
          name: dc1-leaf2c
        uplink_switches:
        - dc1-leaf2a
        - dc1-leaf2b
    type: l2leaf
  declares:
  - dc1-leaf1c
  - dc1-leaf2c
---
apiVersion: avd.netclab.dev/v1alpha1
kind: NodeSet
metadata:
  name: dc1-l3-leaves
spec:
  design:
    l3leaf:
      defaults:
        loopback_ipv6_pool: 2001:DB8:1::/48
        mlag_peer_address_family: ipv6
        mlag_peer_ipv6_pool: 2001:DB8:3::/48
        mlag_peer_l3_ipv6_pool: 2001:DB8:4::/48
        platform: cEOSLab
        router_id_pool: 10.255.1.0/24
        spanning_tree_mode: mstp
        spanning_tree_priority: 4096
        uplink_ipv6_pool: 2001:DB8:2::/48
        uplink_switches:
        - dc1-spine1
        - dc1-spine2
        virtual_router_mac_address: 00:1c:73:00:00:99
        vtep_loopback_ipv6_pool: 2001:DB8:5::/48
      node_groups:
      - bgp_as: 65101
        group: DC1_L3_LEAF1
        nodes:
        - id: 1
          mgmt_ip: 172.16.1.101/24
          name: dc1-leaf1a
        - id: 2
          mgmt_ip: 172.16.1.102/24
          name: dc1-leaf1b
      - bgp_as: 65102
        group: DC1_L3_LEAF2
        nodes:
        - id: 3
          mgmt_ip: 172.16.1.103/24
          name: dc1-leaf2a
        - id: 4
          mgmt_ip: 172.16.1.104/24
          name: dc1-leaf2b
    type: l3leaf
  declares:
  - dc1-leaf1a
  - dc1-leaf1b
  - dc1-leaf2a
  - dc1-leaf2b
---
apiVersion: avd.netclab.dev/v1alpha1
kind: NodeSet
metadata:
  name: dc1-spines
spec:
  design:
    spine:
      defaults:
        bgp_as: 65100
        loopback_ipv6_pool: 2001:DB8:0::/48
        platform: cEOSLab
        router_id_pool: 10.255.0.0/24
      nodes:
      - id: 1
        mgmt_ip: 172.16.1.11/24
        name: dc1-spine1
      - id: 2
        mgmt_ip: 172.16.1.12/24
        name: dc1-spine2
    type: spine
  declares:
  - dc1-spine1
  - dc1-spine2
---
apiVersion: avd.netclab.dev/v1alpha1
kind: Fabric
metadata:
  name: single-dc-l3ls-ipv6
spec:
  fabricName: FABRIC
  requires:
  - kind: ConnectedEndpointSet
    name: connected-endpoints
  - kind: SettingSet
    name: fabric
  - kind: NetworkServiceSet
    name: network-services
  - kind: SettingSet
    name: dc1
  - kind: NodeSet
    name: dc1-l2-leaves
  - kind: NodeSet
    name: dc1-l3-leaves
  - kind: NodeSet
    name: dc1-spines
