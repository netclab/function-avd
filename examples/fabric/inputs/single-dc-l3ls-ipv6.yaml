    tenants:
    - l2vlans:
      - id: 3401
        name: L2_VLAN3401
      - id: 3402
        name: L2_VLAN3402
      mac_vrf_vni_base: 10000
      name: TENANT1
      vrfs:
      - name: VRF10
        svis:
        - enabled: true
          id: 11
          ip_address_virtual: 10.10.11.1/24
          name: VRF10_VLAN11
        - enabled: true
          id: 12
          ip_address_virtual: 10.10.12.1/24
          name: VRF10_VLAN12
        vrf_vni: 10
        vtep_diagnostic:
          loopback: 10
          loopback_ip_range: 10.255.10.0/27
      - name: VRF11
        svis:
        - enabled: true
          id: 21
          ipv6_address_virtuals:
          - 2001:DB8:21::1/48
          name: VRF11_VLAN21
        - enabled: true
          id: 22
          ip_address_virtual: 10.10.22.1/24
          name: VRF11_VLAN22
