apiVersion: avd.netclab.dev/v1alpha1
kind: ConnectedEndpointSet
metadata:
  name: connected-endpoints
spec:
  design:
    servers:
    - adapters:
      - endpoint_ports:
        - PCI1
        - PCI2
        mode: trunk
        native_vlan: 4092
        port_channel:
          endpoint_port_channel: Bond1
          mode: active
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        - Ethernet5
        switches:
        - dc1-leaf1a
        - dc1-leaf1b
        vlans: 11-12,21-22
      - endpoint_ports:
        - iLO
        mode: access
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        switches:
        - dc1-leaf1c
        vlans: 11
      name: dc1-leaf1-server1
    - adapters:
      - endpoint_ports:
        - PCI1
        - PCI2
        mode: trunk
        native_vlan: 4092
        port_channel:
          mode: active
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        - Ethernet5
        switches:
        - dc1-leaf2a
        - dc1-leaf2b
        vlans: 11-12,21-22
      - endpoint_ports:
        - iLO
        mode: access
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        switches:
        - dc1-leaf2c
        vlans: 11
      name: dc1-leaf2-server1
  appliesTo:
    nodeSets:
    - dc1-l2-leaves
    - dc1-l3-leaves
---
apiVersion: avd.netclab.dev/v1alpha1
kind: SettingSet
metadata:
  name: fabric
spec:
  design:
    aaa_settings:
      local_users:
      - name: admin
        no_password: true
        privilege: 15
        role: network-admin
      - name: arista
        privilege: 15
        role: network-admin
        sha512_password: $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
    bgp_peer_groups:
      evpn_overlay_peers:
        password: Q4fqtbqcZ7oQuKfuWtNGRQ==
      ipv4_underlay_peers:
        name: IPv6-UNDERLAY-PEERS
        password: F0bdF6JLcJtagc6PCN8W0Q==
      mlag_ipv4_underlay_peer:
        name: MLAG-IPv6-UNDERLAY-PEER
        password: GNtuK+/vTwZwSZiwj1FK/Q==
    cv_settings:
      onprem_clusters:
      - name: primary
        servers:
        - name: 192.168.1.12
      terminattr:
        disable_aaa: true
    default_interfaces:
    - downlink_interfaces:
      - Ethernet1-8
      platforms:
      - default
      types:
      - spine
      uplink_interfaces:
      - Ethernet1-2
    - downlink_interfaces:
      - Ethernet8
