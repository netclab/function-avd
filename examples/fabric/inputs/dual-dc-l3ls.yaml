apiVersion: avd.netclab.dev/v1alpha1
kind: NetworkServiceSet
metadata:
  name: network-services
spec:
  design:
    tenants:
    - l2vlans:
      - id: 3401
        name: L2_VLAN3401
      - id: 3402
        name: L2_VLAN3402
      mac_vrf_vni_base: 10000
      name: TENANT1
      vrfs:
      - name: VRF10
        svis:
        - enabled: true
          id: 11
          ip_address_virtual: 10.10.11.1/24
          name: VRF10_VLAN11
        - enabled: true
          id: 12
          ip_address_virtual: 10.10.12.1/24
          name: VRF10_VLAN12
        vrf_vni: 10
        vtep_diagnostic:
          loopback: 10
          loopback_ip_range: 10.255.10.0/27
      - name: VRF11
        svis:
        - enabled: true
          id: 21
          ip_address_virtual: 10.10.21.1/24
          name: VRF11_VLAN21
        - enabled: true
          id: 22
          ip_address_virtual: 10.10.22.1/24
          name: VRF11_VLAN22
        vrf_vni: 11
        vtep_diagnostic:
          loopback: 11
          loopback_ip_range: 10.255.11.0/27
  appliesTo:
    nodeSets:
    - dc1-l2-leafs
    - dc1-l3-leafs
    - dc2-l2-leafs
    - dc2-l3-leafs
---
