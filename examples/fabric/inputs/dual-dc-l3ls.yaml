apiVersion: avd.netclab.dev/v1alpha1
kind: ConnectedEndpointSet
metadata:
  name: connected-endpoints
spec:
  design:
    servers:
    - adapters:
      - endpoint_ports:
        - PCI1
        - PCI2
        mode: trunk
        native_vlan: 4092
        port_channel:
          description: PortChannel dc1-leaf1-server1
          mode: active
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        - Ethernet5
        switches:
        - dc1-leaf1a
        - dc1-leaf1b
        vlans: 11-12,21-22
      - endpoint_ports:
        - iLO
        mode: access
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        switches:
        - dc1-leaf1c
        vlans: 11
      name: dc1-leaf1-server1
    - adapters:
      - endpoint_ports:
        - PCI1
        - PCI2
        mode: trunk
        native_vlan: 4092
        port_channel:
          mode: active
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        - Ethernet5
        switches:
        - dc1-leaf2a
        - dc1-leaf2b
        vlans: 11-12,21-22
      - endpoint_ports:
        - iLO
        mode: access
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        switches:
        - dc1-leaf2c
        vlans: 11
      name: dc1-leaf2-server1
    - adapters:
      - endpoint_ports:
        - PCI1
        - PCI2
        mode: trunk
        native_vlan: 4092
        port_channel:
          endpoint_port_channel: Bond1
          mode: active
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        - Ethernet5
        switches:
        - dc2-leaf1a
        - dc2-leaf1b
        vlans: 11-12,21-22
      - endpoint_ports:
        - iLO
        mode: access
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        switches:
        - dc2-leaf1c
        vlans: 11
      name: dc2-leaf1-server1
    - adapters:
      - endpoint_ports:
        - PCI1
        - PCI2
        mode: trunk
        native_vlan: 4092
        port_channel:
          mode: active
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        - Ethernet5
        switches:
        - dc2-leaf2a
        - dc2-leaf2b
        vlans: 11-12,21-22
      - endpoint_ports:
        - iLO
        mode: access
        spanning_tree_portfast: edge
        switch_ports:
        - Ethernet5
        switches:
        - dc2-leaf2c
        vlans: 11
      name: dc2-leaf2-server1
  appliesTo:
    nodeSets:
    - dc1-l2-leafs
    - dc1-l3-leafs
    - dc2-l2-leafs
    - dc2-l3-leafs
---
