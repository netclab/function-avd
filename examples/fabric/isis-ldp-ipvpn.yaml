apiVersion: avd.netclab.dev/v1alpha1
kind: Fabric
metadata:
  name: isis-ldp-ipvpn
  namespace: default
spec:
  fabricName: FABRIC
  design:
    management_eapi:
      enabled: true
    eos_designs_documentation:
      topology_csv: true
      p2p_links_csv: true
    underlay_routing_protocol: isis-ldp
    overlay_routing_protocol: ibgp
    aaa_settings:
      local_users:
      - name: admin
        privilege: 15
        role: network-admin
        no_password: true
      - name: arista
        privilege: 15
        role: network-admin
        sha512_password: $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
    bgp_peer_groups:
      mpls_overlay_peers:
        password: $1c$G8BQN0ezkiJOX2cuAYpsEA==
      rr_overlay_peers:
        password: $1c$G8BQN0ezkiJOX2cuAYpsEA==
    custom_structured_configuration_management_security:
      password:
        encryption_key_common: true
    mgmt_gateway: 172.16.1.1
    bgp_as: 65001
    bgp_distance:
      external_routes: 20
      internal_routes: 200
      local_routes: 200
    p:
      defaults:
        platform: cEOSLab
        loopback_ipv4_pool: 10.255.0.0/27
        isis_system_id_prefix: '0000.0000'
      nodes:
      - name: p1
        id: 1
        mgmt_ip: 172.16.1.11/24
      - name: p2
        id: 2
        mgmt_ip: 172.16.1.12/24
      - name: p3
        id: 3
        mgmt_ip: 172.16.1.13/24
      - name: p4
        id: 4
        mgmt_ip: 172.16.1.14/24
    pe:
      defaults:
        platform: cEOSLab
        loopback_ipv4_pool: 10.255.1.0/27
        virtual_router_mac_address: 00:1c:73:00:dc:00
        mpls_route_reflectors:
        - rr1
        - rr2
        isis_system_id_prefix: '0000.0001'
        spanning_tree_mode: none
      node_groups:
      - group: WAN1-PE1-2
        nodes:
        - name: pe1
          id: 1
          mgmt_ip: 172.16.1.101/24
        - name: pe2
          id: 2
          mgmt_ip: 172.16.1.102/24
      - group: WAN1-PE3
        nodes:
        - name: pe3
          id: 3
          mgmt_ip: 172.16.1.103/24
    rr:
      defaults:
        platform: cEOSLab
        spanning_tree_mode: none
        loopback_ipv4_pool: 10.255.2.0/27
        mpls_route_reflectors:
        - rr1
        - rr2
        isis_system_id_prefix: '0000.0002'
      node_groups:
      - group: WAN1_RR1-2
        nodes:
        - name: rr1
          id: 1
          mgmt_ip: 172.16.1.151/24
        - name: rr2
          id: 2
          mgmt_ip: 172.16.1.152/24
    core_interfaces:
      p2p_links_ip_pools:
      - name: core_pool
        ipv4_pool: 10.255.3.0/24
      p2p_links_profiles:
      - name: core_profile
        isis_metric: 50
        ip_pool: core_pool
        isis_circuit_type: level-2
        isis_authentication_mode: md5
        isis_authentication_key: $1c$sTNAlR6rKSw=
      p2p_links:
      - nodes:
        - pe1
        - p1
        id: 1
        interfaces:
        - Ethernet1
        - Ethernet1
        profile: core_profile
      - nodes:
        - pe1
        - p2
        id: 2
        interfaces:
        - Ethernet2
        - Ethernet2
        profile: core_profile
      - nodes:
        - pe2
        - p2
        id: 3
        interfaces:
        - Ethernet1
        - Ethernet1
        profile: core_profile
      - nodes:
        - pe2
        - p1
        id: 4
        interfaces:
        - Ethernet2
        - Ethernet2
        profile: core_profile
      - nodes:
        - p1
        - p2
        id: 5
        interfaces:
        - Ethernet4
        - Ethernet4
        profile: core_profile
      - nodes:
        - rr1
        - p1
        id: 6
        interfaces:
        - Ethernet3
        - Ethernet3
        profile: core_profile
      - nodes:
        - rr1
        - p3
        id: 7
        interfaces:
        - Ethernet2
        - Ethernet2
        profile: core_profile
      - nodes:
        - rr1
        - rr2
        id: 8
        interfaces:
        - Ethernet4
        - Ethernet4
        profile: core_profile
      - nodes:
        - rr2
        - p2
        id: 9
        interfaces:
        - Ethernet3
        - Ethernet3
        profile: core_profile
      - nodes:
        - rr2
        - p4
        id: 10
        interfaces:
        - Ethernet2
        - Ethernet2
        profile: core_profile
      - nodes:
        - p3
        - p4
        id: 11
        interfaces:
        - Ethernet4
        - Ethernet4
        profile: core_profile
      - nodes:
        - pe3
        - p3
        id: 12
        interfaces:
        - Ethernet1
        - Ethernet1
        profile: core_profile
      - nodes:
        - pe3
        - p4
        id: 13
        interfaces:
        - Ethernet3
        - Ethernet3
        profile: core_profile
    tenants:
    - name: CUSTOMER1
      vrfs:
      - name: C1_VRF1
        vrf_id: 10
        address_families:
        - vpn-ipv4
        ospf:
          enabled: true
          nodes:
          - pe1
          - pe2
          - pe3
        l3_interfaces:
        - interfaces:
          - Ethernet3.10
          - Ethernet4.10
          - Ethernet2
          nodes:
          - pe1
          - pe2
          - pe3
          description: C1_L3_SERVICE
          enabled: true
          ip_addresses:
          - 10.0.1.1/29
          - 10.0.1.2/29
          - 10.0.1.9/30
          ospf:
            enabled: true
    - name: CUSTOMER2
      vrfs:
      - name: C2_VRF1
        vrf_id: 20
        address_families:
        - vpn-ipv4
        l3_interfaces:
        - interfaces:
          - Ethernet3.20
          - Ethernet4.20
          - Ethernet4
          nodes:
          - pe1
          - pe2
          - pe3
          description: C2_L3_SERVICE
          enabled: true
          ip_addresses:
          - 10.1.1.1/29
          - 10.1.1.2/29
          - 10.1.1.9/30
        bgp_peers:
        - ip_address: 10.1.1.3
          remote_as: 65123
          description: C2_ROUTER1
          send_community: standard
          maximum_routes: 100
          nodes:
          - pe1
          - pe2
        - ip_address: 10.1.1.10
          remote_as: 65124
          description: C2_ROUTER2
          send_community: standard
          maximum_routes: 100
          nodes:
          - pe3
    default_node_types:
    - node_type: p
      match_hostnames:
      - ^p1$
      - ^p2$
      - ^p3$
      - ^p4$
    - node_type: pe
      match_hostnames:
      - ^pe1$
      - ^pe2$
      - ^pe3$
    - node_type: rr
      match_hostnames:
      - ^rr1$
      - ^rr2$
