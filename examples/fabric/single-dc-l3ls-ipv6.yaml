apiVersion: avd.netclab.dev/v1alpha1
kind: Fabric
metadata:
  name: single-dc-l3ls-ipv6
  namespace: default
spec:
  fabricName: FABRIC
  design:
    servers:
    - name: dc1-leaf1-server1
      adapters:
      - endpoint_ports:
        - PCI1
        - PCI2
        switch_ports:
        - Ethernet5
        - Ethernet5
        switches:
        - dc1-leaf1a
        - dc1-leaf1b
        vlans: 11-12,21-22
        native_vlan: 4092
        mode: trunk
        spanning_tree_portfast: edge
        port_channel:
          endpoint_port_channel: Bond1
          mode: active
      - endpoint_ports:
        - iLO
        switch_ports:
        - Ethernet5
        switches:
        - dc1-leaf1c
        vlans: 11
        mode: access
        spanning_tree_portfast: edge
    - name: dc1-leaf2-server1
      adapters:
      - endpoint_ports:
        - PCI1
        - PCI2
        switch_ports:
        - Ethernet5
        - Ethernet5
        switches:
        - dc1-leaf2a
        - dc1-leaf2b
        vlans: 11-12,21-22
        native_vlan: 4092
        mode: trunk
        spanning_tree_portfast: edge
        port_channel:
          mode: active
      - endpoint_ports:
        - iLO
        switch_ports:
        - Ethernet5
        switches:
        - dc1-leaf2c
        vlans: 11
        mode: access
        spanning_tree_portfast: edge
    eos_designs_documentation:
      topology_csv: true
      p2p_links_csv: true
    underlay_routing_protocol: ebgp
    overlay_routing_protocol: ebgp
    aaa_settings:
      local_users:
      - name: admin
        privilege: 15
        role: network-admin
        no_password: true
      - name: arista
        privilege: 15
        role: network-admin
        sha512_password: $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
    bgp_peer_groups:
      evpn_overlay_peers:
        password: Q4fqtbqcZ7oQuKfuWtNGRQ==
      ipv4_underlay_peers:
        name: IPv6-UNDERLAY-PEERS
        password: F0bdF6JLcJtagc6PCN8W0Q==
      mlag_ipv4_underlay_peer:
        name: MLAG-IPv6-UNDERLAY-PEER
        password: GNtuK+/vTwZwSZiwj1FK/Q==
    default_interfaces:
    - types:
      - spine
      platforms:
      - default
      uplink_interfaces:
      - Ethernet1-2
      downlink_interfaces:
      - Ethernet1-8
    - types:
      - l3leaf
      platforms:
      - default
      uplink_interfaces:
      - Ethernet1-2
      mlag_interfaces:
      - Ethernet3-4
      downlink_interfaces:
      - Ethernet8
    - types:
      - l2leaf
      platforms:
      - default
      uplink_interfaces:
      - Ethernet1-2
    cv_settings:
      onprem_clusters:
      - name: primary
        servers:
        - name: 192.168.1.12
      terminattr:
        disable_aaa: true
    dns_settings:
      servers:
      - ip_address: 192.168.1.1
    underlay_ipv6: true
    underlay_ipv6_numbered: true
    fabric_ip_addressing:
      mlag:
        ipv6_prefix_length: 64
      loopback:
        ipv6_prefix_length: 64
      p2p_uplinks:
        ipv6_prefix_length: 64
    ntp_settings:
      server_vrf: use_mgmt_interface_vrf
      servers:
      - name: 0.pool.ntp.org
    tenants:
    - name: TENANT1
      mac_vrf_vni_base: 10000
      vrfs:
      - name: VRF10
        vrf_vni: 10
        vtep_diagnostic:
          loopback: 10
          loopback_ip_range: 10.255.10.0/27
        svis:
        - id: 11
          name: VRF10_VLAN11
          enabled: true
          ip_address_virtual: 10.10.11.1/24
        - id: 12
          name: VRF10_VLAN12
          enabled: true
          ip_address_virtual: 10.10.12.1/24
      - name: VRF11
        vrf_vni: 11
        vtep_diagnostic:
          loopback: 11
          loopback_ip_range: 10.255.11.0/27
        svis:
        - id: 21
          name: VRF11_VLAN21
          enabled: true
          ipv6_address_virtuals:
          - 2001:DB8:21::1/48
        - id: 22
          name: VRF11_VLAN22
          enabled: true
          ip_address_virtual: 10.10.22.1/24
      - name: VRF12
        vrf_vni: 12
        vtep_diagnostic:
          loopback: 12
          loopback_ip_range: 10.255.12.0/27
        svis:
        - id: 31
          name: VRF12_VLAN31
          enabled: true
          ipv6_address_virtuals:
          - 2001:DB8:31::1/48
        - id: 32
          name: VRF12_VLAN32
          enabled: true
          ipv6_address_virtuals:
          - 2001:DB8:32::1/48
      l2vlans:
      - id: 3401
        name: L2_VLAN3401
      - id: 3402
        name: L2_VLAN3402
    mgmt_gateway: 172.16.1.1
    management_eapi:
      enabled: true
    l3leaf:
      defaults:
        platform: cEOSLab
        router_id_pool: 10.255.1.0/24
        loopback_ipv6_pool: 2001:DB8:1::/48
        vtep_loopback_ipv6_pool: 2001:DB8:5::/48
        uplink_switches:
        - dc1-spine1
        - dc1-spine2
        uplink_ipv6_pool: 2001:DB8:2::/48
        mlag_peer_address_family: ipv6
        mlag_peer_ipv6_pool: 2001:DB8:3::/48
        mlag_peer_l3_ipv6_pool: 2001:DB8:4::/48
        virtual_router_mac_address: 00:1c:73:00:00:99
        spanning_tree_priority: 4096
        spanning_tree_mode: mstp
      node_groups:
      - group: DC1_L3_LEAF1
        bgp_as: 65101
        nodes:
        - name: dc1-leaf1a
          id: 1
          mgmt_ip: 172.16.1.101/24
        - name: dc1-leaf1b
          id: 2
          mgmt_ip: 172.16.1.102/24
      - group: DC1_L3_LEAF2
        bgp_as: 65102
        nodes:
        - name: dc1-leaf2a
          id: 3
          mgmt_ip: 172.16.1.103/24
        - name: dc1-leaf2b
          id: 4
          mgmt_ip: 172.16.1.104/24
    l2leaf:
      defaults:
        platform: cEOSLab
        spanning_tree_mode: mstp
      node_groups:
      - group: DC1_L2_LEAF1
        uplink_switches:
        - dc1-leaf1a
        - dc1-leaf1b
        nodes:
        - name: dc1-leaf1c
          id: 1
          mgmt_ip: 172.16.1.151/24
      - group: DC1_L2_LEAF2
        uplink_switches:
        - dc1-leaf2a
        - dc1-leaf2b
        nodes:
        - name: dc1-leaf2c
          id: 1
          mgmt_ip: 172.16.1.152/24
    spine:
      defaults:
        platform: cEOSLab
        router_id_pool: 10.255.0.0/24
        loopback_ipv6_pool: 2001:DB8:0::/48
        bgp_as: 65100
      nodes:
      - name: dc1-spine1
        id: 1
        mgmt_ip: 172.16.1.11/24
      - name: dc1-spine2
        id: 2
        mgmt_ip: 172.16.1.12/24
    default_node_types:
    - node_type: l2leaf
      match_hostnames:
      - ^dc1\-leaf1c$
      - ^dc1\-leaf2c$
    - node_type: l3leaf
      match_hostnames:
      - ^dc1\-leaf1a$
      - ^dc1\-leaf1b$
      - ^dc1\-leaf2a$
      - ^dc1\-leaf2b$
    - node_type: spine
      match_hostnames:
      - ^dc1\-spine1$
      - ^dc1\-spine2$
