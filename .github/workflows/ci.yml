name: CI

# ruff and the whole suite; then, per architecture, the runtime image, the render served
# from it, and both packages. Release calls this workflow and publishes the packages it
# built.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A fixed name, not github.workflow: called from Release, that is "Release", and a group
# equal to the caller's own cancels the caller.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XP_VERSION: v2.5.0

jobs:
  test:
    name: ruff and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      # The exact tag: setup-uv publishes floating major aliases only up to v7.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.10
          enable-cache: true

      - name: Crossplane CLI
        run: |
          curl -sfL https://cli.crossplane.io/install.sh | sh
          sudo mv crossplane /usr/local/bin/

      - run: uv sync --locked
      - run: uvx ruff check
      - run: uvx ruff format --check
      - run: uv run pytest -q

  packages:
    name: packages (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.10
          enable-cache: true

      - name: Crossplane CLI
        run: |
          curl -sfL https://cli.crossplane.io/install.sh | sh
          sudo mv crossplane /usr/local/bin/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: function-avd-runtime
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - run: uv sync --locked

      - name: The render, served from the image
        env:
          FUNCTION_IMAGE: function-avd-runtime
        run: uv run pytest -q tests/test_render_cli.py

      - name: Function package
        run: |
          docker save function-avd-runtime -o runtime.tar
          crossplane xpkg build --package-root=package \
            --embed-runtime-image-tarball=runtime.tar -o function-avd-${{ matrix.arch }}.xpkg

      - name: Configuration package
        if: matrix.arch == 'amd64'
        run: crossplane xpkg build --package-root=apis --examples-root=example -o configuration-avd.xpkg

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: '*.xpkg'
          if-no-files-found: error
          retention-days: 1
