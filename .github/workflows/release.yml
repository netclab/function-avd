name: Release

# A tag v* pushes the packages CI built in this run to xpkg.upbound.io, the function first,
# then makes the GitHub Release. The version is pyproject.toml's, and the tag is checked
# against it.
#
# xpkg.upbound.io takes the Upbound login from the variable UPBOUND_USERNAME, and a token
# of that account from the secret UPBOUND_TOKEN.

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  XP_VERSION: v2.5.0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: xpkg.upbound.io, then the GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.10

      - name: The tag is pyproject.toml's version
        run: |
          set -euo pipefail
          version="v$(uv version --short)"
          if [[ "${GITHUB_REF_NAME}" != "${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not pyproject.toml's version ${version}"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Crossplane CLI
        run: |
          curl -sfL https://cli.crossplane.io/install.sh | sh
          sudo mv crossplane /usr/local/bin/

      - uses: docker/login-action@v4
        with:
          registry: xpkg.upbound.io
          username: ${{ vars.UPBOUND_USERNAME }}
          password: ${{ secrets.UPBOUND_TOKEN }}

      - name: Push
        run: |
          set -euo pipefail
          crossplane xpkg push -f dist/function-avd-amd64.xpkg,dist/function-avd-arm64.xpkg \
            "xpkg.upbound.io/netclab/function-avd:${GITHUB_REF_NAME}"
          crossplane xpkg push -f dist/configuration-avd.xpkg \
            "xpkg.upbound.io/netclab/configuration-avd:${GITHUB_REF_NAME}"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.xpkg --verify-tag --generate-notes
