apiVersion: meta.pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-avd
  annotations:
    meta.crossplane.io/maintainer: netclab.dev
    meta.crossplane.io/source: github.com/netclab/function-avd
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: >-
      Runs Arista AVD in Crossplane: a Fabric renders into its Devices, and each Device
      pushes its config over eAPI.
    meta.crossplane.io/readme: |
      This composition function runs [Arista AVD](https://avd.arista.com) in Crossplane,
      for the `avd.netclab.dev` API that
      [configuration-avd](https://marketplace.upbound.io/configurations/netclab/configuration-avd)
      installs:

      * a `Fabric` runs AVD's `eos_designs` role over the repository its `FabricInput`s
        and ConfigMaps rebuild, and composes one `Device` per host with that host's
        structured config;
      * a `Device` renders its `eos.cfg` with pyavd, and composes a provider-http
        `Request` that pushes it over eAPI.

      [netadopt](https://github.com/netclab/netadopt) writes these objects from an
      existing AVD repository. The function takes no input of its own.
spec:
  capabilities:
  - composition
