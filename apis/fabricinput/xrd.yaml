apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: fabricinputs.avd.netclab.dev
spec:
  scope: Namespaced
  group: avd.netclab.dev
  names:
    kind: FabricInput
    plural: fabricinputs
  defaultCompositionRef:
    name: fabricinput-avd
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: >-
                The variables of one inventory scope -- a group or hosts -- as the user's
                group_vars or host_vars hold them.
              properties:
                appliesTo:
                  type: object
                  description: >-
                    The group or the hosts the variables are for, spelled as the inventory
                    spells them.
                  properties:
                    group:
                      type: string
                      minLength: 1
                    hosts:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                  oneOf:
                    - required:
                        - group
                    - required:
                        - hosts
                beside:
                  type: string
                  description: >-
                    The root the vars file sits in: beside the inventory, or beside the
                    playbook, which outranks it.
                  enum:
                    - inventory
                    - playbook
                design:
                  type: object
                  description: The variables, as the file holds them.
                  x-kubernetes-preserve-unknown-fields: true
              required:
                - appliesTo
                - beside
                - design
