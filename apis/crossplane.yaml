apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: configuration-avd
  annotations:
    meta.crossplane.io/maintainer: netclab.dev
    meta.crossplane.io/source: github.com/netclab/function-avd
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: >-
      The avd.netclab.dev API -- Fabric, FabricInput and Device -- served by function-avd.
    meta.crossplane.io/readme: |
      The `avd.netclab.dev` API and its Compositions, served by
      [function-avd](https://marketplace.upbound.io/functions/netclab/function-avd):

      * `Fabric` -- one AVD fabric: the play, the inventory groups and `ansible.cfg`,
        and the ConfigMaps and `FabricInput`s it lists;
      * `FabricInput` -- the variables for one group, or for hosts;
      * `Device` -- one host's structured config, and where its eAPI is.

      [netadopt](https://github.com/netclab/netadopt) writes them from an existing AVD
      repository. Installing this also installs function-avd and provider-http.

      First, before installing this Configuration, apply the CPU and memory function-avd
      runs with:

      ```yaml
      apiVersion: pkg.crossplane.io/v1beta1
      kind: DeploymentRuntimeConfig
      metadata:
        name: function-avd
      spec:
        deploymentTemplate:
          spec:
            selector: {}
            template:
              spec:
                containers:
                - name: package-runtime
                  resources:
                    requests:
                      cpu: "1"
                      memory: 1Gi
                    limits:
                      cpu: "4"
                      memory: 1Gi
      ---
      apiVersion: pkg.crossplane.io/v1beta1
      kind: ImageConfig
      metadata:
        name: function-avd
      spec:
        matchImages:
        - prefix: xpkg.upbound.io/netclab/function-avd
        runtime:
          configRef:
            name: function-avd
      ```

      Last, after this Configuration is healthy, apply the provider config that every
      Device's push uses:

      ```yaml
      apiVersion: http.m.crossplane.io/v1alpha2
      kind: ClusterProviderConfig
      metadata:
        name: default
      spec:
        credentials:
          source: None
      ```
spec:
  crossplane:
    version: ">=v2.4.0"
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.upbound.io/netclab/function-avd
    version: v0.2.1
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-http
    version: ">=v1.0.14"
