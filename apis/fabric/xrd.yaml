# CompositeResourceDefinition for an AVD fabric.
#
# One Fabric == one AVD fabric (a single `fabric_name`). This is deliberate:
# AVD facts are fabric-wide (get_avd_facts needs every device at once), so the
# living model must be reconciled per fabric, not per device. A composite
# function expands one Fabric into per-device outputs.
#
# spec.design carries a fabric-wide AVD eos_designs document. Its inner shape is
# AVD's own data model (pinned to the avd/ submodule version), which is far too
# large to restate in OpenAPI and would drift from AVD; it is therefore kept
# structurally open and validated at reconcile time by pyavd, with results
# surfaced on status. Device roles are resolved inside the document via
# `default_node_types` / node-type blocks.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: fabrics.avd.netclab.dev
spec:
  # Crossplane v2: namespaced composite resources (no legacy claim needed).
  scope: Namespaced
  group: avd.netclab.dev
  names:
    kind: Fabric
    plural: fabrics
    categories:
    - crossplane
    - netclab
  defaultCompositionRef:
    name: fabric-avd
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                fabricName:
                  type: string
                  description: >-
                    AVD `fabric_name`. Promoted to a typed field for
                    selectors/status; injected into the design at reconcile.
                  minLength: 1
                design:
                  type: object
                  description: >-
                    Fabric-wide AVD eos_designs input document (node-type blocks,
                    default_node_types, tenants, connected endpoints, ...).
                    Validated by pyavd; violations reported on status. A fabric
                    may instead be assembled from input objects listed in
                    spec.requires, in which case this carries only what is
                    fabric-wide and the inputs carry the rest.
                  x-kubernetes-preserve-unknown-fields: true
                requires:
                  type: array
                  description: >-
                    The input objects composing this fabric. Only objects listed
                    here take part in the render, however they are labelled --
                    which is what makes the rendered document a function of this
                    Fabric rather than of whatever else exists in the namespace,
                    and it matters because the render is pushed as a full config
                    replacement. An entry that does not resolve leaves the Fabric
                    not ready, naming the object it could not find. List order is
                    the merge order: a later input replaces an earlier one's keys,
                    which is how a setting is narrowed to part of the fabric.
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - NodeSet
                          - NetworkServiceSet
                          - ConnectedEndpointSet
                          - SettingSet
                          - Secret
                      name:
                        type: string
                        minLength: 1
                      namespace:
                        type: string
                        description: >-
                          Namespace holding the object. Defaults to the Fabric's
                          own namespace.
                    required:
                      - kind
                      - name
                nodeIdPool:
                  type: object
                  description: >-
                    Where this fabric's node IDs come from when the design sets
                    fabric_numbering.node_id.algorithm to pool_manager. AVD then
                    hands out IDs instead of reading them off each node, and
                    keeps the assignments in a file. There is no such file in a
                    cluster, so the Fabric composes a ConfigMap and reads it back
                    on the next reconcile. Nothing here is needed for a fabric
                    that numbers its nodes itself.
                  properties:
                    seedConfigMapName:
                      type: string
                      description: >-
                        A ConfigMap holding assignments to start from, read once
                        when this fabric has no pool of its own yet. It exists
                        for a fabric that was already running elsewhere: AVD
                        generated its IDs and they are in a file, and a fabric
                        that starts over assigns different ones - which reaches
                        every device as a full configuration replacement. Not
                        needed for a new fabric, and ignored once the composed
                        pool exists, so it seeds rather than overrides.
                      minLength: 1
                    seedKey:
                      type: string
                      description: >-
                        Key within that ConfigMap. Defaults to the key the
                        composed pool uses.
                      minLength: 1
                push:
                  type: object
                  description: >-
                    Enable pushing rendered configs to the devices over eAPI.
                    Each selected Device composes a provider-http Request that
                    observes the device's config digest and replaces the config
                    when model or device drifts. Absent means render-only.
                  properties:
                    hosts:
                      type: array
                      description: >-
                        Hostnames to push to; defaults to every device. The lab
                        runs a subset of the fabric (LAB_HOSTS), and a push to
                        a device that isn't running never converges.
                      items:
                        type: string
                    urlTemplate:
                      type: string
                      description: >-
                        eAPI endpoint per device; {hostname} and {namespace}
                        are substituted. Defaults to the netclab-chart Service,
                        https://{hostname}.{namespace}.svc/command-api.
                    credentialsSecretName:
                      type: string
                      description: >-
                        Secret (same namespace) whose `basic` key holds the
                        base64 user:password token for eAPI basic auth. The
                        credentials must stay valid across the first push --
                        the pushed config replaces the bootstrap users.
                      minLength: 1
                    providerConfigName:
                      type: string
                      description: provider-http ProviderConfig name (default eapi).
                    insecureSkipTLSVerify:
                      type: boolean
                      description: cEOS serves a self-signed cert; default true.
                  required:
                    - credentialsSecretName
              # `design` is NOT required: a fabric may be assembled entirely from
              # the inputs named in `spec.requires`, which is what `avd-migrate`
              # emits and what `fn.py` has always accepted ("design or requires").
              # Requiring it here made every migrated Fabric unapplyable, and no
              # offline test could see it -- they drive RunFunction directly and
              # never meet the API server's schema.
              required:
                - fabricName
            status:
              type: object
              properties:
                fabricName:
                  type: string
                deviceCount:
                  type: integer
                  description: Devices discovered in the design.
                devices:
                  type: array
                  description: Devices resolved from the design and their roles.
                  items:
                    type: object
                    properties:
                      hostname:
                        type: string
                      nodeType:
                        type: string
                validation:
                  type: object
                  description: Result of pyavd input validation for this fabric.
                  properties:
                    ok:
                      type: boolean
                    message:
                      type: string
              # Composite function may attach richer, evolving detail.
              x-kubernetes-preserve-unknown-fields: true
