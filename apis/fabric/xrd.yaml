apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: fabrics.avd.netclab.dev
spec:
  scope: Namespaced
  group: avd.netclab.dev
  names:
    kind: Fabric
    plural: fabrics
  defaultCompositionRef:
    name: fabric-avd
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: >-
                One AVD fabric, as the user's Ansible holds it: the play, ansible.cfg, the
                inventory's groups, and the files it reads.
              x-kubernetes-preserve-unknown-fields: true
              properties:
                inputs:
                  type: array
                  description: >-
                    The FabricInputs in this namespace that make up the fabric. It is
                    rendered only once every one is found.
                  items:
                    type: string
                extraVars:
                  type: object
                  description: >-
                    ansible-playbook -e, outranking the repository's own variables.
                  x-kubernetes-preserve-unknown-fields: true
                vaultPassword:
                  type: object
                  description: >-
                    The Secret in this namespace holding the vault password, where the
                    repository's ansible.cfg names a file for it.
                  properties:
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                        key:
                          type: string
                          minLength: 1
                      required:
                        - name
                        - key
                  required:
                    - secretRef
                pools:
                  type: array
                  description: The pool files eos_designs reads and rewrites, each from a ConfigMap key.
                  items:
                    type: object
                    properties:
                      configMapRef:
                        type: object
                        properties:
                          name:
                            type: string
                            minLength: 1
                          key:
                            type: string
                            minLength: 1
                        required:
                          - name
                          - key
                      path:
                        type: string
                        minLength: 1
                        description: The file's path, relative to the root beside names.
                      beside:
                        type: string
                        enum:
                          - inventory
                          - playbook
                    required:
                      - configMapRef
                      - path
                      - beside
                files:
                  type: array
                  description: The files the repository names by path, each from a ConfigMap key.
                  items:
                    type: object
                    properties:
                      configMapRef:
                        type: object
                        properties:
                          name:
                            type: string
                            minLength: 1
                          key:
                            type: string
                            minLength: 1
                        required:
                          - name
                          - key
                      path:
                        type: string
                        minLength: 1
                        description: The file's path, relative to the root beside names.
                      beside:
                        type: string
                        enum:
                          - inventory
                          - playbook
                    required:
                      - configMapRef
                      - path
                      - beside
              required:
                - inputs
            status:
              type: object
              properties:
                inputs:
                  type: array
                  description: The FabricInputs the last render read.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      generation:
                        type: integer
                        format: int64
                configMaps:
                  type: array
                  description: The ConfigMaps the last render read, named by spec.pools and spec.files.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      resourceVersion:
                        type: string
                missing:
                  type: object
                  description: What the spec names and is not found; the render waits for it.
                  properties:
                    inputs:
                      type: array
                      items:
                        type: string
                    configMaps:
                      type: array
                      description: A key that is absent, or with no key, a ConfigMap that is.
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          key:
                            type: string
                unlisted:
                  type: array
                  description: >-
                    FabricInputs labelled avd.netclab.dev/fabric for this Fabric and not in
                    spec.inputs; not rendered.
                  items:
                    type: string
                error:
                  type: string
                  description: >-
                    What the last render failed with, empty after one that succeeded. While
                    it holds anything, the Devices keep the structured configuration they have.
                rendered:
                  type: string
                  description: >-
                    The hash of everything the last render read: the spec, the FabricInputs,
                    the ConfigMaps and the vault password. While it is the same, nothing is
                    rendered again.
